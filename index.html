<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> WhatsApp Tools </title>
    <!-- fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <noscript>&lt;h2&gt;Enable JavaScript&lt;/h2&gt;</noscript>
    <header> <h1> WhatsApp Tools by AceAkki </h1> </header>
    <section>
        <div class="main-container">
            <div class="min-sec">
                <label>Select Country</label>
                <select name="countryCode" id="prefixSelect">
                    <option data-countrycode="default" value="0" selected>Select Country</option>
                </select>
            </div>
            <div class="min-sec">
                <label>Custom Prefix</label>
                <input id="prefixInput" type="number" maxlength="5">
            </div>
            <div class="min-sec">
                <label>Mobile Number</label>
                <input id="mobileNumber" type="number">
            </div>
            <div class="buttons">
                <div class="btns-grp">
                    <a class="btn" id="sendMSG">WA Message</a>
                    <a class="btn" id="sendHi">With Hi</a>
                </div>
                <div class="btns-grp">
                    <a class="btn" id="makeCall">Call </a>
                    <a class="btn" id="makeMessage">Message </a>
                </div>
                <div class="btns-grp">
                    <a class="btn" id="copyLink">Link </a>
                </div>
            </div>
        </div>
    </section>
    <!-- aos JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="js/index.js" type="module"></script>
</body>

</html>
